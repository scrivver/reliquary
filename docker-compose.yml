services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json:ro

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
      MINIO_BUCKET: ${MINIO_BUCKET:-reliquary}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set reliquary http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
          mc ready reliquary; do
          sleep 2
        done
        mc mb --ignore-existing "reliquary/$$MINIO_BUCKET"

  api:
    image: reliquary-api:latest
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      PROXY_BASE_URL: ${PROXY_BASE_URL:-http://localhost:2080}
      MINIO_PORT: 9000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
      MINIO_BUCKET: ${MINIO_BUCKET:-reliquary}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
      EVENT_QUEUE: ${EVENT_QUEUE:-engram.ingest}
      EVENT_DEVICE_NAME: ${EVENT_DEVICE_NAME:-reliquary}
      THUMBNAIL_QUEUE: ${THUMBNAIL_QUEUE:-reliquary.thumbnail}
      AUTH_MODE: ${AUTH_MODE:-full}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "reliquary-api-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  thumbnail-worker:
    image: reliquary-thumbnail-worker:latest
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MINIO_PORT: 9000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-in-production}
      MINIO_BUCKET: ${MINIO_BUCKET:-reliquary}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      THUMBNAIL_QUEUE: ${THUMBNAIL_QUEUE:-reliquary.thumbnail}
      THUMBNAIL_DEAD_QUEUE: ${THUMBNAIL_DEAD_QUEUE:-reliquary.thumbnail.dead}
      THUMBNAIL_PREFETCH: ${THUMBNAIL_PREFETCH:-1}
      THUMBNAIL_CONCURRENCY: ${THUMBNAIL_CONCURRENCY:-4}
      THUMBNAIL_MAX_ATTEMPTS: ${THUMBNAIL_MAX_ATTEMPTS:-5}
    healthcheck:
      test: ["CMD", "reliquary-thumbnail-worker-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  ingress:
    image: reliquary-ingress:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "${RELIQUARY_PORT:-2080}:2080"
    volumes:
      - ./frontend/build/web:/srv/web:ro
    healthcheck:
      test: ["CMD", "reliquary-ingress-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  minio_data:
  rabbitmq_data:
