name: Android

on:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "frontend/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/android.yml"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android SDK path
        working-directory: frontend
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
          } > android/local.properties

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        run: flutter test

      - name: Build release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Rename APK
        working-directory: frontend
        run: |
          short_sha="$(printf '%s' '${{ github.sha }}' | cut -c1-12)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/reliquary-android-sha-$short_sha.apk"
          if printf '%s' '${{ github.ref }}' | grep -q '^refs/tags/'; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/reliquary-android-${GITHUB_REF_NAME}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: reliquary-android-apk
          path: frontend/dist/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" frontend/dist/*.apk --clobber
          else
            gh release create "$tag" frontend/dist/*.apk \
              --title "$tag" \
              --notes "Reliquary Android APK for $tag."
          fi
