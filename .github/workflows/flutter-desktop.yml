name: Flutter Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter-desktop.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/flutter-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            artifact_name: reliquary-linux-x64
            artifact_path: frontend/build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            artifact_name: reliquary-windows-x64
            artifact_path: frontend/build/windows/x64/runner/Release

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
        working-directory: .

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to match the nix-provided toolchain in shells/frontend.nix.
          # A floating `channel: stable` drifts ahead of the committed
          # pubspec.lock and fails to compile pinned dependencies.
          flutter-version: 3.41.2
          channel: stable
          cache: true

      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
